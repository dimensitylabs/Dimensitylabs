<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Discover Design Deliver">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes pulse{0%,100%{r:6;opacity:.5}50%{r:9;opacity:1}}
      @keyframes dash{to{stroke-dashoffset:-40}}
      @keyframes up{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
      .node{animation:pulse 2.4s ease-in-out infinite}
      .path{stroke-dasharray:8 8;animation:dash 1.2s linear infinite}
      .c1{animation:up .6s ease .1s both}
      .c2{animation:up .6s ease .25s both}
      .c3{animation:up .6s ease .4s both}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="360" fill="#000101"/>

  <line x1="64" y1="48" x2="100" y2="48" stroke="#ecebe7" stroke-width="1.5"/>
  <text x="112" y="53" class="mono" font-size="12" letter-spacing="3" fill="#757168">METHOD</text>
  <text x="64" y="110" class="sans" font-size="40" font-weight="700" fill="#ffffff">Discover. Design. Deliver.</text>

  <!-- animated connector -->
  <line x1="160" y1="220" x2="1040" y2="220" stroke="#101215" stroke-width="2"/>
  <line x1="160" y1="220" x2="1040" y2="220" stroke="#ff6b9d" stroke-width="1.5" class="path" opacity="0.7"/>

  <g class="c1">
    <circle cx="200" cy="220" r="7" fill="#ff6b9d" class="node"/>
    <text x="200" y="180" text-anchor="middle" class="mono" font-size="12" fill="#757168">01</text>
    <text x="200" y="270" text-anchor="middle" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Discovery</text>
    <text x="200" y="300" text-anchor="middle" class="sans" font-size="13" fill="#757168">Vision, market, constraints</text>
  </g>

  <g class="c2">
    <circle cx="600" cy="220" r="7" fill="#ff6b9d" class="node"/>
    <text x="600" y="180" text-anchor="middle" class="mono" font-size="12" fill="#757168">02</text>
    <text x="600" y="270" text-anchor="middle" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Design</text>
    <text x="600" y="300" text-anchor="middle" class="sans" font-size="13" fill="#757168">Architecture &amp; interfaces</text>
  </g>

  <g class="c3">
    <circle cx="1000" cy="220" r="7" fill="#ff6b9d" class="node"/>
    <text x="1000" y="180" text-anchor="middle" class="mono" font-size="12" fill="#757168">03</text>
    <text x="1000" y="270" text-anchor="middle" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Launch</text>
    <text x="1000" y="300" text-anchor="middle" class="sans" font-size="13" fill="#757168">Ship, support, evolve</text>
  </g>
</svg>
