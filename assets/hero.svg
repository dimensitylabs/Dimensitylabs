<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Dimensity Labs — Built with Integrity">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes fall{
        0%{transform:translateY(-40px) rotate(0deg);opacity:0}
        15%{opacity:.9}
        100%{transform:translateY(520px) rotate(180deg);opacity:0}
      }
      @keyframes bloom{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.85;transform:scale(1.06)}}
      @keyframes scan{0%{transform:translateY(-80px);opacity:0}20%{opacity:.35}80%{opacity:.35}100%{transform:translateY(640px);opacity:0}}
      @keyframes flicker{0%,100%{opacity:.4}50%{opacity:1}}
      .petal{animation:fall linear infinite}
      .p1{animation-duration:9s;animation-delay:0s}
      .p2{animation-duration:11s;animation-delay:1.2s}
      .p3{animation-duration:8s;animation-delay:2.4s}
      .p4{animation-duration:12s;animation-delay:.6s}
      .p5{animation-duration:10s;animation-delay:3s}
      .p6{animation-duration:13s;animation-delay:1.8s}
      .glow{animation:bloom 5s ease-in-out infinite;transform-origin:center}
      .scan{animation:scan 7s ease-in-out infinite}
      .dot{animation:flicker 2.8s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <radialGradient id="sakura" cx="72%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#ff6b9d" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#c43b6e" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#1a0a12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000101" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb3cc" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#ff4d88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff4d88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000101" stop-opacity="1"/>
      <stop offset="55%" stop-color="#000101" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000101" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="#000101"/>

  <!-- blueprint grid -->
  <g stroke="#101215" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200 M0 320 H1200 M0 360 H1200 M0 400 H1200 M0 440 H1200 M0 480 H1200 M0 520 H1200 M0 560 H1200 M0 600 H1200"/>
    <path d="M40 0 V640 M80 0 V640 M120 0 V640 M160 0 V640 M200 0 V640 M240 0 V640 M280 0 V640 M320 0 V640 M360 0 V640 M400 0 V640 M440 0 V640 M480 0 V640 M520 0 V640 M560 0 V640 M600 0 V640 M640 0 V640 M680 0 V640 M720 0 V640 M760 0 V640 M800 0 V640 M840 0 V640 M880 0 V640 M920 0 V640 M960 0 V640 M1000 0 V640 M1040 0 V640 M1080 0 V640 M1120 0 V640 M1160 0 V640"/>
  </g>

  <rect width="1200" height="640" fill="url(#sakura)" class="glow"/>
  <rect x="520" y="0" width="40" height="80" fill="#ff6b9d" opacity="0.12" class="scan"/>

  <!-- abstract bloom / canopy -->
  <g opacity="0.95">
    <ellipse cx="920" cy="210" rx="210" ry="160" fill="url(#orb)" class="glow"/>
    <ellipse cx="1000" cy="280" rx="140" ry="110" fill="url(#orb)" opacity="0.7"/>
    <ellipse cx="820" cy="300" rx="90" ry="70" fill="url(#orb)" opacity="0.5"/>
    <!-- branch lines -->
    <path d="M980 120 C940 200 900 260 860 360 C920 320 980 300 1040 340 C1000 260 1020 180 1060 120" fill="none" stroke="#ff8fb3" stroke-width="1.2" opacity="0.55"/>
    <path d="M900 160 C870 230 840 290 800 380" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.4"/>
    <path d="M1040 150 C1020 240 1060 300 1100 390" fill="none" stroke="#ff6b9d" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- falling petals -->
  <g fill="#ff6b9d">
    <ellipse class="petal p1" cx="760" cy="0" rx="7" ry="4" opacity="0.85"/>
    <ellipse class="petal p2" cx="840" cy="0" rx="9" ry="4" opacity="0.7"/>
    <ellipse class="petal p3" cx="920" cy="0" rx="6" ry="3" opacity="0.9"/>
    <ellipse class="petal p4" cx="1000" cy="0" rx="8" ry="4" opacity="0.65"/>
    <ellipse class="petal p5" cx="880" cy="0" rx="5" ry="3" opacity="0.8"/>
    <ellipse class="petal p6" cx="1080" cy="0" rx="7" ry="3.5" opacity="0.55"/>
  </g>

  <!-- ground glow field -->
  <ellipse cx="960" cy="560" rx="280" ry="50" fill="#ff4d88" opacity="0.18" class="glow"/>
  <circle cx="860" cy="540" r="4" fill="#ffb3cc" class="dot"/>
  <circle cx="920" cy="555" r="3" fill="#ff6b9d" class="dot"/>
  <circle cx="990" cy="548" r="5" fill="#ff8fb3" class="dot"/>
  <circle cx="1040" cy="560" r="2.5" fill="#ff6b9d" class="dot"/>

  <rect x="0" y="0" width="620" height="640" fill="url(#fadeR)"/>

  <!-- copy -->
  <text x="64" y="88" class="sans" font-size="15" font-weight="700" letter-spacing="3" fill="#ecebe7">DIMENSITY</text>
  <text x="198" y="88" class="sans" font-size="13" font-weight="400" letter-spacing="2" fill="#757168">LABS™</text>

  <line x1="64" y1="140" x2="108" y2="140" stroke="#ecebe7" stroke-width="1.5"/>
  <text x="120" y="145" class="mono" font-size="13" fill="#757168">Premium digital agency building transformative experiences</text>

  <text x="64" y="250" class="sans" font-size="64" font-weight="700" fill="#ffffff">Digital products</text>
  <text x="64" y="322" class="sans" font-size="64" font-weight="700" fill="#ffffff">we build.</text>

  <text x="64" y="400" class="sans" font-size="28" font-weight="500" fill="#ff8fb3">Built with Integrity</text>
  <text x="64" y="450" class="sans" font-size="16" fill="#757168">Web · Mobile · AI Integration · Design &amp; UX</text>

  <text x="64" y="540" class="sans" font-size="56" font-weight="700" fill="#ffffff">10+</text>
  <text x="64" y="572" class="mono" font-size="12" letter-spacing="2" fill="#757168">PROJECTS SHIPPED</text>
</svg>
