<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="Dimensity Labs — Built with Integrity">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
      .cursor{animation:blink 1.2s steps(1) infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="140" fill="#000101"/>
  <line x1="64" y1="1" x2="1136" y2="1" stroke="#101215"/>

  <text x="600" y="58" text-anchor="middle" class="sans" font-size="14" font-weight="700" letter-spacing="3" fill="#ecebe7">DIMENSITY</text>
  <text x="600" y="58" text-anchor="middle" dx="78" class="sans" font-size="12" fill="#757168"> LABS™</text>

  <text x="600" y="90" text-anchor="middle" class="sans" font-size="16" fill="#ff8fb3">Built with Integrity</text>
  <text x="600" y="118" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#757168">REMOTE-FIRST  ·  WORLDWIDE  ·  EST. 2025 <tspan class="cursor" fill="#ff6b9d">▌</tspan></text>
</svg>
