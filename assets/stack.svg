<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Tech stack">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes drift{
        0%{transform:translateX(0)}
        100%{transform:translateX(-50%)}
      }
      .rail{animation:drift 28s linear infinite}
      @media (prefers-reduced-motion:reduce){.rail{animation:none!important}}
    </style>
  </defs>

  <rect width="1200" height="220" fill="#000101"/>
  <line x1="64" y1="48" x2="100" y2="48" stroke="#ecebe7" stroke-width="1.5"/>
  <text x="112" y="53" class="mono" font-size="12" letter-spacing="3" fill="#757168">STACK</text>
  <text x="64" y="100" class="sans" font-size="32" font-weight="700" fill="#ffffff">Our tech stack.</text>

  <clipPath id="chips">
    <rect x="64" y="130" width="1072" height="56"/>
  </clipPath>

  <g clip-path="url(#chips)">
    <g class="rail">
      <!-- duplicated chip row for seamless loop -->
      <g>
        <rect x="64" y="138" width="100" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="114" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">React</text>
        <rect x="180" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="235" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Next.js</text>
        <rect x="306" y="138" width="130" height="36" rx="18" fill="#020204" stroke="#ff6b9d" stroke-opacity="0.45"/>
        <text x="371" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ff8fb3">TypeScript</text>
        <rect x="452" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="507" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Node.js</text>
        <rect x="578" y="138" width="130" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="643" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">PostgreSQL</text>
        <rect x="724" y="138" width="90" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="769" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">AWS</text>
        <rect x="830" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="885" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">OpenAI</text>
        <rect x="956" y="138" width="120" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="1016" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Anthropic</text>
      </g>
      <g transform="translate(1060,0)">
        <rect x="64" y="138" width="100" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="114" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">React</text>
        <rect x="180" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="235" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Next.js</text>
        <rect x="306" y="138" width="130" height="36" rx="18" fill="#020204" stroke="#ff6b9d" stroke-opacity="0.45"/>
        <text x="371" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ff8fb3">TypeScript</text>
        <rect x="452" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="507" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Node.js</text>
        <rect x="578" y="138" width="130" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="643" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">PostgreSQL</text>
        <rect x="724" y="138" width="90" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="769" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">AWS</text>
        <rect x="830" y="138" width="110" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="885" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">OpenAI</text>
        <rect x="956" y="138" width="120" height="36" rx="18" fill="#020204" stroke="#101215"/>
        <text x="1016" y="161" text-anchor="middle" class="sans" font-size="13" fill="#ecebe7">Anthropic</text>
      </g>
    </g>
  </g>
</svg>
