<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Studio metrics">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes countGlow{0%,100%{opacity:.7}50%{opacity:1}}
      .n{animation:countGlow 3.5s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="200" fill="#000101"/>
  <rect x="64" y="32" width="1072" height="136" rx="8" fill="#020204" stroke="#101215"/>

  <g class="n">
    <text x="220" y="100" text-anchor="middle" class="sans" font-size="44" font-weight="700" fill="#ffffff">2025</text>
    <text x="220" y="132" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#757168">FOUNDED</text>
  </g>
  <line x1="360" y1="60" x2="360" y2="140" stroke="#101215"/>
  <g class="n">
    <text x="500" y="100" text-anchor="middle" class="sans" font-size="44" font-weight="700" fill="#ffffff">10+</text>
    <text x="500" y="132" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#757168">CLIENTS</text>
  </g>
  <line x1="640" y1="60" x2="640" y2="140" stroke="#101215"/>
  <g class="n">
    <text x="780" y="100" text-anchor="middle" class="sans" font-size="44" font-weight="700" fill="#ff8fb3">100%</text>
    <text x="780" y="132" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#757168">SENIOR</text>
  </g>
  <line x1="920" y1="60" x2="920" y2="140" stroke="#101215"/>
  <g class="n">
    <text x="1040" y="100" text-anchor="middle" class="sans" font-size="44" font-weight="700" fill="#ffffff">24/7</text>
    <text x="1040" y="132" text-anchor="middle" class="mono" font-size="11" letter-spacing="2" fill="#757168">COVERAGE</text>
  </g>
</svg>
