<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="What we build — Web Mobile AI Design">
  <defs>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes in{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:translateX(0)}}
      @keyframes bar{0%,100%{width:24px;opacity:.4}50%{width:48px;opacity:1}}
      .r1{animation:in .6s ease .05s both}
      .r2{animation:in .6s ease .18s both}
      .r3{animation:in .6s ease .31s both}
      .r4{animation:in .6s ease .44s both}
      .accent{animation:bar 3s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
    <linearGradient id="rowGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d88" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000101" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="#000101"/>
  <g stroke="#101215" stroke-width="1" opacity="0.9">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200"/>
  </g>

  <line x1="64" y1="56" x2="100" y2="56" stroke="#ecebe7" stroke-width="1.5"/>
  <text x="112" y="61" class="mono" font-size="12" letter-spacing="3" fill="#757168">CAPABILITIES</text>
  <text x="64" y="120" class="sans" font-size="48" font-weight="700" fill="#ffffff">What we build.</text>
  <text x="64" y="160" class="sans" font-size="15" fill="#757168">Full-spectrum digital product work — from first wireframe to production.</text>

  <g class="r1">
    <rect x="64" y="196" width="1072" height="68" fill="url(#rowGlow)"/>
    <rect x="64" y="226" width="28" height="2" fill="#ff6b9d" class="accent"/>
    <text x="64" y="236" class="mono" font-size="13" fill="#757168">01</text>
    <text x="120" y="236" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Web Development</text>
    <text x="420" y="236" class="sans" font-size="14" fill="#757168">Responsive products · Next.js · TypeScript</text>
  </g>

  <g class="r2">
    <text x="64" y="304" class="mono" font-size="13" fill="#757168">02</text>
    <text x="120" y="304" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Mobile Apps</text>
    <text x="420" y="304" class="sans" font-size="14" fill="#757168">iOS · Android · React Native · Expo</text>
  </g>

  <g class="r3">
    <rect x="64" y="336" width="1072" height="68" fill="url(#rowGlow)" opacity="0.7"/>
    <text x="64" y="372" class="mono" font-size="13" fill="#757168">03</text>
    <text x="120" y="372" class="sans" font-size="22" font-weight="600" fill="#ecebe7">AI Integration</text>
    <text x="420" y="372" class="sans" font-size="14" fill="#757168">LLMs · OpenAI · Anthropic · custom pipelines</text>
  </g>

  <g class="r4">
    <text x="64" y="440" class="mono" font-size="13" fill="#757168">04</text>
    <text x="120" y="440" class="sans" font-size="22" font-weight="600" fill="#ecebe7">Design &amp; UX</text>
    <text x="420" y="440" class="sans" font-size="14" fill="#757168">Quiet craft · systems · brand-ready interfaces</text>
  </g>
</svg>
