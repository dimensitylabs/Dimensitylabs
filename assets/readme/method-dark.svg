.fill{transform-box:fill-box;transform-origin:left center}
.ring{transform-box:fill-box;transform-origin:center}
.r0{animation:r0 7s ease-out infinite}@keyframes r0{0%,2%{transform:scale(1);opacity:0}2.5%{opacity:.8}20%,100%{transform:scale(4);opacity:0}}.n0{animation:n0 7s linear infinite}@keyframes n0{0%,2%{fill:#11120D}2.5%,92%{fill:#FFFBF4}96%,100%{fill:#11120D}}.r1{animation:r1 7s ease-out infinite}@keyframes r1{0%,43.5%{transform:scale(1);opacity:0}44.0%{opacity:.8}61.5%,100%{transform:scale(4);opacity:0}}.n1{animation:n1 7s linear infinite}@keyframes n1{0%,43.5%{fill:#11120D}44.0%,92%{fill:#FFFBF4}96%,100%{fill:#11120D}}.r2{animation:r2 7s ease-out infinite}@keyframes r2{0%,85%{transform:scale(1);opacity:0}85.5%{opacity:.8}100%,100%{transform:scale(4);opacity:0}}.n2{animation:n2 7s linear infinite}@keyframes n2{0%,85%{fill:#11120D}85.5%,92%{fill:#FFFBF4}96%,100%{fill:#11120D}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
