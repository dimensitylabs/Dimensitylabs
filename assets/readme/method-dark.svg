.mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}

.trav{animation:trav 7s linear infinite}
@keyframes trav{0%{transform:translateX(0);opacity:0}2%{opacity:1}85%{transform:translateX(960px);opacity:1}92%,100%{transform:translateX(960px);opacity:0}}
.fill{animation:fill 7s linear infinite}
