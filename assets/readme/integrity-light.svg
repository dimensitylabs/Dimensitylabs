<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="What you can count on — Senior-only · You own everything · NDA-first · Compliant by default · Full transparency">
<style>
.serif{font-family:'Cormorant Garamond',Cormorant,Georgia,'Times New Roman',serif}
.sans{font-family:Syne,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
.hl{animation:hl 10s cubic-bezier(.6,0,.2,1) infinite}@keyframes hl{0%,16%{transform:translateY(0px)}20%,36%{transform:translateY(64px)}40%,56%{transform:translateY(128px)}60%,76%{transform:translateY(192px)}80%,96%{transform:translateY(256px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1280" height="540" fill="#FFFBF4"/>
<text x="64" y="72" class="mono" font-size="12" letter-spacing="2" fill="#8A8676">03 / INTEGRITY</text>
<text x="1216" y="72" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#8A8676">HONEST. SENIOR-ONLY. NO SHORTCUTS.</text>
<text x="60" y="142" class="serif" font-size="62" font-weight="300" fill="#11120D">What you can <tspan font-style="italic" fill="#565449">count on.</tspan></text>
<line x1="64" y1="170.5" x2="1216" y2="170.5" stroke="#D8CFBC"/>
<g class="hl"><rect x="64" y="197" width="1152" height="63" fill="#EFE8DA"/>
<rect x="64" y="197" width="3" height="63" fill="#11120D"/>
<path d="M1186 228l6 6 12-12" fill="none" stroke="#11120D" stroke-width="1.6"/></g>
<line x1="64" y1="196.5" x2="1216" y2="196.5" stroke="#D8CFBC"/>
<text x="92" y="236" class="mono" font-size="13" fill="#8A8676">01</text>
<text x="156" y="238" class="serif" font-size="30" fill="#11120D">Senior-only</text>
<text x="580" y="235" class="sans" font-size="15" fill="#565449">The people you meet are the people who build it.</text><line x1="64" y1="260.5" x2="1216" y2="260.5" stroke="#D8CFBC"/>
<text x="92" y="300" class="mono" font-size="13" fill="#8A8676">02</text>
<text x="156" y="302" class="serif" font-size="30" fill="#11120D">You own everything</text>
<text x="580" y="299" class="sans" font-size="15" fill="#565449">Code, IP and infrastructure. No vendor lock-in.</text><line x1="64" y1="324.5" x2="1216" y2="324.5" stroke="#D8CFBC"/>
<text x="92" y="364" class="mono" font-size="13" fill="#8A8676">03</text>
<text x="156" y="366" class="serif" font-size="30" fill="#11120D">NDA-first</text>
<text x="580" y="363" class="sans" font-size="15" fill="#565449">Confidential from the first call.</text><line x1="64" y1="388.5" x2="1216" y2="388.5" stroke="#D8CFBC"/>
<text x="92" y="428" class="mono" font-size="13" fill="#8A8676">04</text>
<text x="156" y="430" class="serif" font-size="30" fill="#11120D">Compliant by default</text>
<text x="580" y="427" class="sans" font-size="15" fill="#565449">GDPR and CCPA. Security reviewed before launch.</text><line x1="64" y1="452.5" x2="1216" y2="452.5" stroke="#D8CFBC"/>
<text x="92" y="492" class="mono" font-size="13" fill="#8A8676">05</text>
<text x="156" y="494" class="serif" font-size="30" fill="#11120D">Full transparency</text>
<text x="580" y="491" class="sans" font-size="15" fill="#565449">Honest scopes, honest timelines, rigorous QA.</text><line x1="64" y1="516.5" x2="1216" y2="516.5" stroke="#D8CFBC"/>
</svg>
